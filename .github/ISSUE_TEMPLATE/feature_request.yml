name: 功能请求
description: 提议新功能、新预装应用或改进方案
title: "feat: "
body:
  - type: markdown
    attributes:
      value: |
        欢迎提出新想法！请说明它要解决的问题，而不仅仅是实现方式。

        > 标题已预填 `feat:` 前缀，请保留——自动打标脚本会据此加上 `enhancement` 标签。
        > 提交前请先搜索已有 issue，避免重复请求。

  - type: dropdown
    id: component
    attributes:
      label: 希望改进的组件
      options:
        - 预装应用 / install-app（新增或更新软件）
        - ISO 构建 / build.sh
        - 引导配置 / edit-grub
        - 系统信息 / edit-os-release
        - 工具脚本 / scripts
        - CI / GitHub Actions
        - 文档
        - 其他 / 不确定
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 想解决什么问题
      description: 描述当前的使用痛点或缺失的能力（希望、建议、需求都可以写在这里）
      placeholder: 希望/建议……因为目前……
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望的方案
      description: 你希望它如何工作？如果是新增预装应用，请写明应用名称与用途
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
      description: 还有其他实现方式吗？为什么没有采用？

  - type: textarea
    id: context
    attributes:
      label: 其他补充
      description: 参考链接、上游项目、相关 issue / PR 或任何有助于判断的信息
