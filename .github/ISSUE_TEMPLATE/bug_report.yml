name: Bug 报告
description: 报告构建、安装、引导或运行中遇到的问题
title: "fix: "
body:
  - type: markdown
    attributes:
      value: |
        感谢提交 Bug 报告！请尽量填写完整信息，方便复现与定位。

        > 标题已预填 `fix:` 前缀，请保留——自动打标脚本会据此加上 `bug` 标签。
        > 提交前请先搜索已有 issue，避免重复。

  - type: dropdown
    id: component
    attributes:
      label: 受影响的组件
      description: 选择最接近的模块；不确定可选「其他 / 不确定」并在下方说明
      options:
        - ISO 构建 / build.sh
        - 预装应用 / install-app
        - 引导配置 / edit-grub
        - 系统信息 / edit-os-release
        - 工具脚本 / scripts
        - CI / GitHub Actions
        - 文档
        - 其他 / 不确定
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: zhenTo 版本
      description: 例如 0.1.1（可查看 build.sh 中的 VERSION 或 os-release 中的 VERSION_ID）
      placeholder: "0.1.1"
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: 运行环境
      description: 物理机或虚拟机（VMware / VirtualBox / QEMU 等）、内存、磁盘、宿主系统
      placeholder: "QEMU 8.2, 4 GB RAM, x86_64, 宿主 Ubuntu 24.04"

  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: 请给出可稳定复现的操作或命令
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望行为
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际行为 / 错误信息
      description: 请粘贴相关报错、失败日志或截图链接（报错、崩溃、异常、无法启动等均可）
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: 其他补充
      description: 已尝试过的排查方法、相关 issue / PR、或任何有帮助的上下文
