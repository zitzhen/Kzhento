name: PR Check

# Pre-merge gate: static checks only, no ISO build, finishes in tens of seconds.
# Mark lint / secrets as required checks in branch protection to block bad PRs.

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pr-check-${{ github.ref }}
  cancel-in-progress: true

env:
  ACTIONLINT_VERSION: v1.7.12
  SHFMT_VERSION: v3.14.1
  GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.30.1

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install linters
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck
          curl -fsSL -o /tmp/actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION#v}_linux_amd64.tar.gz"
          sudo tar -xzf /tmp/actionlint.tar.gz -C /usr/local/bin actionlint
          curl -fsSL -o /tmp/shfmt \
            "https://github.com/mvdan/sh/releases/download/${SHFMT_VERSION}/shfmt_${SHFMT_VERSION}_linux_amd64"
          sudo install -m 0755 /tmp/shfmt /usr/local/bin/shfmt

      - name: Syntax check
        run: |
          set -e
          while IFS= read -r f; do
            case "$(head -n1 "$f")" in
              *bash*) bash -n "$f" ;;
              *) sh -n "$f" ;;
            esac
          done < <(git ls-files '*.sh')

      - name: Unit tests (node:test)
        run: node --test tests/*.test.js

      - name: Version consistency
        run: bash tests/check-version-consistency.sh

      - name: shellcheck
        run: |
          set -e
          mapfile -t files < <(git ls-files '*.sh')
          [ "${#files[@]}" -gt 0 ] || exit 0
          shellcheck --severity=warning --external-sources "${files[@]}"

      - name: shfmt (changed files only)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -e
          mapfile -t files < <(git diff --name-only --diff-filter=ACMR "${BASE_SHA}...HEAD" -- '*.sh')
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No shell scripts changed in this PR"
            exit 0
          fi
          shfmt -d -i 4 "${files[@]}"

      - name: actionlint
        run: actionlint -color

  preflight:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Preflight smoke tests
        run: bash tests/preflight.test.sh

      - name: Login shell tests
        run: bash tests/terminal.test.sh

      - name: Boot splash payload tests
        run: bash tests/plymouth-payload.test.sh

      - name: Boot splash artwork tests
        run: |
          python3 -m pip install --quiet pillow

          # The artwork is not committed (edit-logo.sh downloads it at build
          # time), so fetch the same pinned revision the build uses. The
          # checksum is the one edit-logo.sh verifies against; a mismatch here
          # means the pin and the upstream repo have drifted apart.
          ref=afcfbd5497a4e19b009468a9b3f349edcdba61a3
          sum=eba6a63c01475fe3286b88a1c5eede6a6ccddae1260996afbfc80d78415dfc1f
          mkdir -p logo
          curl -fsSL --retry 3 -o logo/kzhento_transparent.png \
            "https://raw.githubusercontent.com/zitzhen/kzhento-icon/$ref/kzhento_transparent.png"
          echo "$sum  logo/kzhento_transparent.png" | sha256sum -c -

          bash tests/render.test.sh

  secrets:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: gitleaks
        run: |
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/repo" \
            "${GITLEAKS_IMAGE}" \
            dir /repo --no-banner --redact --verbose
